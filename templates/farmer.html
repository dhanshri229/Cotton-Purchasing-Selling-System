<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Farmer Entry - Cotton Sales</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f6f9; }
        .container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; }
        input[type="text"] { width: 95%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; }
        .btn-save { background-color: #27ae60; color: white; padding: 10px 18px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        .btn-save:hover { background-color: #219150; }
        .btn-delete { background-color: #e74c3c; color: white; padding: 5px 10px; text-decoration: none; border-radius: 4px; font-size: 13px; }
        .btn-delete:hover { background-color: #c0392b; }
        table { width: 100%; border-collapse: collapse; margin-top: 25px; }
        table, th, td { border: 1px solid #ddd; }
        th, td { padding: 10px; text-align: left; }
        th { background-color: #34495e; color: white; }
        a.home-link { text-decoration: none; color: #2980b9; }
    </style>
</head>
<body>
    <div class="container">
        <a class="home-link" href="/">Back to Home</a>
        <h2>Farmer Registration</h2>
        
        <form method="POST">
            <label>Farmer Name:</label><br>
            <input type="text" name="name" required placeholder="Enter full name"><br>

            <label>Mobile Number:</label><br>
            <input type="text" name="mobile" placeholder="Enter 10-digit mobile number"><br>

            <label>Aadhar Number:</label><br>
            <input type="text" name="aadhar_number" placeholder="Enter 12-digit Aadhar number" maxlength="12"><br>

            <label>Village / Address:</label><br>
            <input type="text" name="village" placeholder="Enter village or city"><br><br>

            <button type="submit" class="btn-save">Save Farmer</button>
        </form>

        <hr style="margin-top: 30px;">

        <h3>Registered Farmers</h3>
        <table>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Mobile</th>
                <th>Aadhar Number</th>
                <th>Village</th>
                <th>Action</th>
            </tr>
            {% for farmer in farmers %}
            <tr>
                <td>{{ farmer.id }}</td>
                <td>{{ farmer.name }}</td>
                <td>{{ farmer.mobile }}</td>
                <td>{{ farmer.aadhar_number if farmer.aadhar_number else '-' }}</td>
                <td>{{ farmer.village }}</td>
                <td>
                    <a href="/delete_farmer/{{ farmer.id }}" 
                       class="btn-delete" 
                       onclick="return confirm('Are you sure you want to delete this farmer?');">
                       Delete
                    </a>
                </td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
