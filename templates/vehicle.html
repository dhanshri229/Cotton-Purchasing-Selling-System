<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vehicle Entry - Cotton Sales</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f6f9; }
        .container { max-width: 850px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; }
        input[type="text"] { width: 95%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; }
        .btn-save { background-color: #2980b9; color: white; padding: 10px 18px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        .btn-save:hover { background-color: #1f618d; }
        .btn-delete { background-color: #e74c3c; color: white; padding: 5px 10px; text-decoration: none; border-radius: 4px; font-size: 13px; }
        .btn-delete:hover { background-color: #c0392b; }
        table { width: 100%; border-collapse: collapse; margin-top: 25px; }
        table, th, td { border: 1px solid #ddd; }
        th, td { padding: 10px; text-align: left; }
        th { background-color: #34495e; color: white; }
        a.home-link { text-decoration: none; color: #2980b9; }
    </style>
</head>
<body>
    <div class="container">
        <a class="home-link" href="/">Back to Home</a>
        <h2>Vehicle Registration</h2>
        
        <form method="POST">
            <label>Vehicle Number:</label><br>
            <input type="text" name="vehicle_number" required placeholder="e.g. MH-20-AB-1234"><br>

            <label>Driver Name:</label><br>
            <input type="text" name="driver_name" placeholder="Driver full name"><br>

            <label>Driver Mobile:</label><br>
            <input type="text" name="driver_mobile" placeholder="Driver contact number"><br><br>

            <button type="submit" class="btn-save">Save Vehicle</button>
        </form>

        <hr style="margin-top: 30px;">

        <h3>Registered Vehicles</h3>
        <table>
            <tr>
                <th>ID</th>
                <th>Vehicle Number</th>
                <th>Driver Name</th>
                <th>Driver Mobile</th>
                <th>Action</th>
            </tr>
            {% for vehicle in vehicles %}
            <tr>
                <td>{{ vehicle.id }}</td>
                <td>{{ vehicle.vehicle_number }}</td>
                <td>{{ vehicle.driver_name }}</td>
                <td>{{ vehicle.driver_mobile }}</td>
                <td>
                    <a href="/delete_vehicle/{{ vehicle.id }}" 
                       class="btn-delete" 
                       onclick="return confirm('Are you sure you want to delete this vehicle?');">
                       Delete
                    </a>
                </td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
